<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Habkan — Reel</title>
<style>
@font-face{font-family:Alx;font-weight:500;src:url(../fonts/Alexandria-Medium.ttf)}
@font-face{font-family:Alx;font-weight:700;src:url(../fonts/Alexandria-Bold.ttf)}
@font-face{font-family:Alx;font-weight:900;src:url(../fonts/Alexandria-Black.ttf)}
@font-face{font-family:MR;font-weight:500;src:url(../fonts/Manrope-500.ttf)}
@font-face{font-family:MR;font-weight:800;src:url(../fonts/Manrope-800.ttf)}
:root{--ink:#0D0F10;--ink2:#16181B;--ink3:#1E2125;--line:#2A2D31;--lime:#D0F05C;--lime2:#B9D94A;--paper:#F2F3EE;--mute:#8B909B;--wa:#5BD27A;--warn:#FF6B57}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:var(--ink)}
#stage{position:relative;overflow:hidden;background:var(--ink);font-family:Alx,sans-serif;color:var(--paper)}
#bgInk,#bgLime{position:absolute;inset:0}
#bgInk{background:radial-gradient(120% 80% at 50% 40%,#17191c 0%,var(--ink) 70%)}
#bgLime{background:radial-gradient(120% 80% at 50% 40%,#d9f56c 0%,var(--lime) 60%,#c3e14f 100%)}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.scene{position:absolute;inset:0;display:none}
.it{position:absolute;left:0;top:0;will-change:transform,opacity}
.t{direction:rtl;text-align:center;font-weight:900;line-height:1.08;white-space:nowrap;letter-spacing:-.5px}
.lime{color:var(--lime)} .ink{color:var(--ink)} .mute{color:var(--mute)}
.mark{position:relative;display:inline-block;padding:0 .12em}
.mark>b{position:absolute;left:0;right:0;top:12%;bottom:6%;background:var(--lime);z-index:-1;transform-origin:100% 50%}
.stk{background:var(--paper);color:var(--ink);border-radius:22px;box-shadow:0 22px 50px rgba(0,0,0,.5),0 2px 0 rgba(0,0,0,.08)}
.dk{background:var(--ink2);color:var(--paper);border:2px solid var(--line);border-radius:26px;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.tape{position:absolute;width:120px;height:34px;background:rgba(242,243,238,.55);top:-16px;left:50%;margin-left:-60px;transform:rotate(-4deg);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.tex::after{content:"";position:absolute;inset:0;border-radius:inherit;background-image:var(--tex);opacity:.35;mix-blend-mode:multiply;pointer-events:none}
#grain{position:absolute;inset:-200px;opacity:.08;mix-blend-mode:overlay;pointer-events:none}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.5) 100%);pointer-events:none}
#tear{position:absolute;left:0;top:0;pointer-events:none}
#flash{position:absolute;inset:0;background:var(--lime);opacity:0;pointer-events:none;mix-blend-mode:screen}
/* phone */
.phone{width:380px;height:780px;border-radius:58px;background:#050606;padding:14px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.scr{width:100%;height:100%;border-radius:46px;overflow:hidden;background:#F6F4EF;color:#16181B;position:relative;direction:rtl}
.scr .nb{height:74px;display:flex;align-items:center;justify-content:space-between;padding:22px 26px 0;font:900 24px Alx}
.scr .hero{margin:14px 18px 0;height:250px;border-radius:26px;background:linear-gradient(140deg,#2b2f35,#16181b);color:#F2F3EE;padding:26px;position:relative;overflow:hidden}
.scr .hero h5{font:900 32px Alx;line-height:1.15}
.scr .hero p{font:500 15px Alx;opacity:.7;margin-top:8px}
.scr .hero i{position:absolute;left:22px;bottom:22px;height:44px;padding:0 22px;border-radius:22px;background:#F2F3EE;color:#16181B;font:700 16px/44px Alx;font-style:normal}
.scr .row{display:flex;gap:12px;margin:14px 18px}
.scr .pc{flex:1;height:200px;border-radius:20px;background:#fff;border:1px solid #e8e4dc;padding:10px}
.scr .pc div{height:120px;border-radius:14px;background:#ECE7DE;display:grid;place-items:center}
.scr .pc b{display:block;font:700 15px Alx;margin-top:10px}
.scr .pc s{display:block;text-decoration:none;font:500 13px Alx;color:#7a7f88}
.blk{margin:10px 18px;border-radius:18px;padding:14px 18px;font:700 18px Alx;display:flex;align-items:center;justify-content:space-between}
/* logo */
.lockup svg{display:block}
/* CTA */
.cta{display:flex;align-items:center;gap:26px;padding:0 36px;border-radius:36px;direction:rtl}
.cta .ic{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;flex:none}
.cta .tx{flex:1}
.cta .tx b{display:block;font:900 38px Alx;white-space:nowrap}
.cta .tx span{display:block;font:500 25px MR;margin-top:4px;direction:ltr;text-align:right}
</style>
</head>
<body>
<div id="stage">
  <div id="bgInk"></div><div id="bgLime"></div>
  <div id="cam"></div>
  <canvas id="grain" width="1024" height="1024"></canvas>
  <div id="vig"></div>
  <svg id="tear"><defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9F56C"/><stop offset="1" stop-color="#C3E14F"/></linearGradient></defs><path id="tearPath"/></svg>
  <div id="flash"></div>
</div>
<script src="logo-parts.js"></script>
<script src="cues.js"></script>
<script src="film.js"></script>
</body>
</html>
